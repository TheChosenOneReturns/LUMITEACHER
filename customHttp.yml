applications:
  - appRoot: frontend
    customHeaders:
      - pattern: "**/*"
        headers:
          - key: Strict-Transport-Security
            value: "max-age=31536000; includeSubDomains"
          - key: X-Content-Type-Options
            value: "nosniff"
          - key: X-Frame-Options
            value: "DENY"
          - key: Referrer-Policy
            value: "strict-origin-when-cross-origin"
          - key: Permissions-Policy
            value: "camera=(), geolocation=(), microphone=()"
          - key: Content-Security-Policy
            value: "default-src 'self'; base-uri 'self'; connect-src 'self' https://cognito-idp.us-east-2.amazonaws.com https://*.execute-api.us-east-2.amazonaws.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
