<!DOCTYPE html>

<html lang="es"><head>

<style>
        body { font-family: 'Nunito Sans', sans-serif; }
        .celebration-bg {
            background-color: #f6fafe;
            background-image: radial-gradient(#ffe173 2px, transparent 2px), radial-gradient(#6cc8ff 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        .bouncy-btn {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bouncy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 rgba(0,0,0,0) !important;
        }
    </style>

<body class="bg-background text-on-background celebration-bg min-h-screen pb-24">
<!-- Header (Suppressed top-level nav for transactional/success screen, keeping simple header) -->
<header class="w-full flex justify-center items-center py-sm px-margin-mobile h-20">
<h1 class="font-headline-md text-headline-md text-primary font-black">Story Teacher</h1>
</header>
<main class="max-w-md mx-auto px-margin-mobile flex flex-col items-center gap-md relative">
<!-- Confetti/Celebration Visual -->
<div class="relative w-full flex justify-center mb-sm">
<span class="material-symbols-outlined text-secondary-container text-6xl absolute -top-4 -left-4 rotate-12" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-tertiary-container text-5xl absolute top-8 right-2 -rotate-12" style="font-variation-settings: 'FILL' 1;">star</span>
<div class="bg-surface-container-lowest rounded-full p-4 border-4 border-secondary-container shadow-[0px_6px_0px_0px_rgba(232,196,38,1)] flex items-center justify-center w-32 h-32 z-10">
<span class="material-symbols-outlined text-secondary text-7xl" style="font-variation-settings: 'FILL' 1;">trophy</span>
</div>
</div>
<div class="text-center w-full">
<h2 class="font-display-mobile text-display-mobile text-on-surface mb-xs">¡Felicidades!</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Has completado la historia de manera excelente.</p>
</div>
<!-- Skills Progress Card -->
<div class="w-full bg-surface-container-lowest border-2 border-primary-container rounded-xl p-margin-mobile shadow-[0px_8px_0px_0px_rgba(108,200,255,0.2)] flex flex-col gap-sm">
<h3 class="font-headline-md text-headline-md text-primary">Tus Habilidades</h3>
<!-- Skill 1 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface">Comprensión</span>
<span class="font-caption text-caption text-primary">100%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-4 overflow-hidden border-2 border-surface-container-highest relative">
<div class="bg-gradient-to-r from-tertiary-container to-tertiary h-full rounded-full w-full"></div>
<div class="absolute top-0 left-0 w-full h-1 bg-white opacity-30"></div>
</div>
</div>
<!-- Skill 2 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface">Inferencias</span>
<span class="font-caption text-caption text-primary">85%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-4 overflow-hidden border-2 border-surface-container-highest relative">
<div class="bg-gradient-to-r from-primary-container to-primary h-full rounded-full w-[85%]"></div>
<div class="absolute top-0 left-0 w-full h-1 bg-white opacity-30"></div>
</div>
</div>
<!-- Skill 3 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface">Vocabulario</span>
<span class="font-caption text-caption text-primary">90%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-4 overflow-hidden border-2 border-surface-container-highest relative">
<div class="bg-gradient-to-r from-secondary-container to-secondary-fixed-dim h-full rounded-full w-[90%]"></div>
<div class="absolute top-0 left-0 w-full h-1 bg-white opacity-30"></div>
</div>
</div>
<!-- Skill 4 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface">Secuencia</span>
<span class="font-caption text-caption text-primary">95%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-4 overflow-hidden border-2 border-surface-container-highest relative">
<div class="bg-gradient-to-r from-tertiary-container to-tertiary h-full rounded-full w-[95%]"></div>
<div class="absolute top-0 left-0 w-full h-1 bg-white opacity-30"></div>
</div>
</div>
<!-- Skill 5 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-label-bold text-label-bold text-on-surface">Causa y efecto</span>
<span class="font-caption text-caption text-primary">80%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-4 overflow-hidden border-2 border-surface-container-highest relative">
<div class="bg-gradient-to-r from-primary-container to-primary h-full rounded-full w-[80%]"></div>
<div class="absolute top-0 left-0 w-full h-1 bg-white opacity-30"></div>
</div>
</div>
</div>
<!-- Mascot & Speech Bubble -->
<div class="w-full flex items-end justify-center gap-4 mt-sm">
<div class="w-24 h-24 shrink-0">
<img alt="Lumi the owl mascot" class="w-full h-full object-contain drop-shadow-lg" src="https://lh3.googleusercontent.com/aida/AP1WRLtYKk6ODSDxi3vb1wg84Jf8CjYnz1v0EZ0-UBgBP0OhthWYe21ZxhI62O0w05BjykdwPLl7lfGI3783Jku6K-s2fndCqn5tMGHLCQJqFPUg5gXC9NAilp48M3xBQntdK6zMkhpm5oYXQyXjKYAcikTkV-Do3bnTmDuCl-VnlgRdRHjLQsX4r2D26oTt6krnjDeo7M8LQQALTTJNp9tA6qexmRL90oNmuFs6DutfDr1YK6gyBGm15L7jUUiT"/>
</div>
<div class="bg-surface-container-lowest border-2 border-outline-variant rounded-2xl rounded-bl-none p-sm shadow-[0px_4px_0px_0px_rgba(190,200,208,1)] relative">
<p class="font-body-md text-body-md text-on-surface">¡Eres un lector increíble! Tus habilidades están mejorando muy rápido.</p>
<!-- Speech bubble tail -->
<div class="absolute -bottom-2 -left-2 w-4 h-4 bg-surface-container-lowest border-b-2 border-l-2 border-outline-variant rotate-45"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-sm mt-md w-full">
<button class="bouncy-btn w-full bg-primary text-on-primary font-label-bold text-label-bold py-4 px-6 rounded-xl border-b-4 border-on-primary-fixed-variant shadow-[0px_4px_0px_0px_rgba(0,30,46,0.3)] flex justify-center items-center gap-2">
<span class="material-symbols-outlined">magic_button</span>
                ✨ Crear otra aventura
            </button>
<button class="bouncy-btn w-full bg-surface-container-lowest text-primary border-2 border-primary font-label-bold text-label-bold py-4 px-6 rounded-xl border-b-4 shadow-[0px_4px_0px_0px_rgba(0,101,142,0.3)] flex justify-center items-center gap-2">
<span class="material-symbols-outlined">library_books</span>
                📚 Ver biblioteca
            </button>
</div>
</main>
</body></html>
