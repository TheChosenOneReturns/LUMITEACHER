AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Story Teacher - MVP educativo serverless

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
  StoryGeneratorMode:
    Type: String
    Default: fixture
    AllowedValues: [fixture, bedrock]
  DynamoDbEndpoint:
    Type: String
    Default: ""
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  BedrockGuardrailId:
    Type: String
    Default: ""
  BedrockGuardrailVersion:
    Type: String
    Default: DRAFT
  SessionIpPolicy:
    Type: String
    Default: observe
    AllowedValues: [off, observe, strict]

Conditions:
  HasGuardrail: !Not [!Equals [!Ref BedrockGuardrailId, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [x86_64]
    MemorySize: 768
    Timeout: 29
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref StoryTeacherTable
        DYNAMODB_ENDPOINT: !Ref DynamoDbEndpoint
        STORY_GENERATOR_MODE: !Ref StoryGeneratorMode
        AUTH_MODE: cognito
        SESSION_IP_POLICY: !Ref SessionIpPolicy
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_GUARDRAIL_ID: !Ref BedrockGuardrailId
        BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        MAX_GENERATIONS_PER_USER_PER_DAY: "20"
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref AllowedOrigin
      AllowHeaders:
        - Authorization
        - Content-Type
        - X-Demo-User-Id
        - Idempotency-Key
      AllowMethods:
        - GET
        - POST
        - PATCH
        - OPTIONS
      MaxAge: 600

Resources:
  StoryTeacherUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      VerificationMessageTemplate:
        EmailSubject: "Tu código de LUMI ✨"
        EmailMessage: |
          <!DOCTYPE html>
          <html lang="es">
          <body style="margin:0;padding:0;background:#f4faff;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4faff;padding:24px 0;">
              <tr><td align="center">
                <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border:3px solid #6cc8ff;border-radius:24px;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif;">
                  <tr><td align="center" style="background:#003f5c;padding:28px 20px 20px;">
                    <img src="https://main.d3l7lwifmxwzzj.amplifyapp.com/email/lumi-mail.png" alt="Lumi" width="140" style="display:block;margin:0 auto 10px;" />
                    <div style="color:#fdd73b;font-size:26px;font-weight:900;letter-spacing:3px;">LUMI</div>
                  </td></tr>
                  <tr><td style="padding:28px 34px 8px;color:#003f5c;font-size:18px;font-weight:800;text-align:center;">
                    ¡Tu aventura te está esperando!
                  </td></tr>
                  <tr><td style="padding:6px 34px 10px;color:#42525c;font-size:14px;line-height:22px;text-align:center;">
                    Usá este código para continuar. Es válido por tiempo limitado:
                  </td></tr>
                  <tr><td align="center" style="padding:10px 0 18px;">
                    <div style="display:inline-block;background:#fff8cc;border:3px dashed #fdd73b;border-radius:18px;padding:14px 30px;color:#003f5c;font-size:32px;font-weight:900;letter-spacing:9px;">{####}</div>
                  </td></tr>
                  <tr><td style="padding:0 34px 26px;color:#7a8a94;font-size:12px;line-height:19px;text-align:center;">
                    Si no pediste este código, podés ignorar este correo.<br/>Nunca compartas tu código con nadie.
                  </td></tr>
                  <tr><td style="background:#e9f7ff;padding:14px;color:#00658e;font-size:11px;text-align:center;">
                    LUMI · Cuentos interactivos para aprender leyendo
                  </td></tr>
                </table>
              </td></tr>
            </table>
          </body>
          </html>

  StoryTeacherUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-web
      UserPoolId: !Ref StoryTeacherUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10
      ReadAttributes:
        - email
      WriteAttributes:
        - email

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30

  StoryTeacherApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${StoryTeacherUserPool}
              audience:
                - !Ref StoryTeacherUserPoolClient

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /health
            Method: GET
    Metadata: &EsbuildMetadata
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/health.ts

  CreateStoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/createStory.handler
      Environment:
        Variables:
          GENERATION_WORKER_FUNCTION_NAME: !Ref GenerationWorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
        - LambdaInvokePolicy:
            FunctionName: !Ref GenerationWorkerFunction
      Events:
        CreateStory:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /stories
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/createStory.ts

  GenerationWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/generationWorker.handler
      MemorySize: 1024
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt StoryTeacherTable.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0"
            - Fn::If:
                - HasGuardrail
                - Effect: Allow
                  Action:
                    - bedrock:ApplyGuardrail
                  Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${BedrockGuardrailId}"
                - !Ref "AWS::NoValue"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/generationWorker.ts

  GetGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/getGeneration.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
      Events:
        GetGeneration:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /generations/{generationId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/getGeneration.ts

  ListStoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/listStories.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
      Events:
        ListStories:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /stories
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/listStories.ts

  GetStoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/getStory.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
      Events:
        GetStory:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /stories/{storyId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/getStory.ts

  SubmitAttemptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/submitAttempt.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt StoryTeacherTable.Arn
      Events:
        SubmitAttempt:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /stories/{storyId}/attempts
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/submitAttempt.ts

  GetAttemptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/getAttempt.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
      Events:
        GetAttempt:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /attempts/{attemptId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/getAttempt.ts

  PlatformFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/handlers/platform.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTeacherTable
      Events:
        PublicCatalog:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /catalog
            Method: GET
        PublicProfilesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /demo/profiles
            Method: GET
        PublicProfilesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /demo/profiles
            Method: POST
        PublicInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /invites/{token}
            Method: GET
        CorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /{proxy+}
            Method: OPTIONS
        PlatformRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoryTeacherApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        EntryPoints:
          - backend/src/handlers/platform.ts

  StoryTeacherTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: StoryTeacher
        - Key: Environment
          Value: hackathon

Outputs:
  ApiUrl:
    Description: URL pública del HTTP API
    Value: !Sub https://${StoryTeacherApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Description: Tabla DynamoDB
    Value: !Ref StoryTeacherTable
  UserPoolId:
    Description: User Pool de Cognito para Amplify
    Value: !Ref StoryTeacherUserPool
  UserPoolClientId:
    Description: Cliente web público de Cognito
    Value: !Ref StoryTeacherUserPoolClient
